[package]
name = "fotocull"
version = "1.1.0"
description = "Fast photo culling (JPG+ARW) from an SD card"
authors = ["octoone"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fotocull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
kamadak-exif = "0.5"
jpeg-decoder = "0.3"
jpeg-encoder = "0.6"
fast_image_resize = { version = "5", features = ["image"] }


# Dependencies (image decoding, hashing) are optimized even in dev builds: an
# unoptimized JPEG decode or SHA-256 is ~10x slower and makes `tauri dev` crawl.
# The app itself gets light optimization too, since generic pixel code (e.g.
# rotating a preview) is compiled in this crate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
