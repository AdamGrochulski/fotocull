name: release

# Build native installers for all three desktop platforms and attach them to a
# GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`), or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Intel and Apple silicon Macs, ad-hoc signed
          # (signingIdentity "-" in tauri.conf.json).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Updater artifacts (signed update bundles + latest.json) are produced
      # only here: they need the private key, which local builds don't have.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "fotocull ${{ github.ref_name }}"
          releaseBody: |
            **Which file do I need?**
            - Windows: the file ending in `_x64-setup.exe`
            - macOS (Intel and Apple silicon): the file ending in `_universal.dmg`
            - Linux: the `.AppImage` (or the `.deb` on Debian/Ubuntu)

            The other files (`.sig`, `.tar.gz`, `latest.json`) are for automatic updates; you don't need them.

            **First launch.** The installers aren't code-signed yet. Windows may show SmartScreen: *More info → Run anyway*. On macOS open the app once, then *System Settings → Privacy & Security → Open Anyway*. After that, fotocull updates itself from the start screen.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
